---
deployment:
  tasks:
    - 'export DEPLOYPATH="$HOME/public_html/"'
    - '/bin/mkdir -p "$DEPLOYPATH"'
    - '/bin/cp -R assets canvaskit icons "$DEPLOYPATH"'
    - '/bin/cp favicon.png flutter.js flutter_bootstrap.js flutter_service_worker.js main.dart.js manifest.json version.json "$DEPLOYPATH"'
    - '/bin/cp index.html "$DEPLOYPATH"'
